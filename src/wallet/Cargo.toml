[package]
name = "wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
agent_core = { path = "../core/agent_core" }
arc-swap = "1"
aries-askar = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Quantum-resistant cryptography (always enabled) — vendored minimal surface
crypto = { path = "../crypto" }

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures = "0.3"

[lints]
workspace = true
