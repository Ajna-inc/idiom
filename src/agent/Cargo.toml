[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Workspace crates - Core infrastructure
agent_core = { path = "../core/agent_core" }
agent_di = { path = "../core/agent_di" }
agent_events = { path = "../core/agent_events" }
agent_module = { path = "../agent_module" }

# Workspace crates - Storage & Wallet
storage = { path = "../storage" }
wallet = { path = "../wallet" }

# Workspace crates - DID infrastructure
did = { path = "../did" }

# Workspace crates - DIDComm
didcomm = { path = "../didcomm" }

# Workspace crates - Protocols
protocol_oob = { path = "../protocols/oob", features = ["events"] }
protocol_connections = { path = "../protocols/connections", features = ["events"] }
protocol_basic_messages = { path = "../protocols/basic_messages", features = ["events"] }
protocol_discover_features = { path = "../protocols/discover_features" }
protocol_user_profile = { path = "../protocols/user_profile", features = ["events"] }
protocol_coordinate_mediation = { path = "../protocols/coordinate_mediation", features = ["events"] }
protocol_pickup = { path = "../protocols/pickup", features = ["events"] }
protocol_push_notifications = { path = "../protocols/push_notifications" }
protocol_workflow = { path = "../protocols/workflow", features = ["events"] }

# did:ajna method (minimal build: no dht/kademlia)

# AnonCreds (optional - for anonymous credential issuance/verification)
anoncreds_core = { path = "../credentials/anoncreds_core", optional = true }
protocol_credentials = { path = "../protocols/credentials", optional = true }
protocol_proofs = { path = "../protocols/proofs", optional = true }
# Kanon on-chain AnonCreds registry (VDR) — live Besu client via alloy.
registry_kanon = { path = "../registry_kanon", optional = true, features = ["besu"] }

# Workspace crates - Verifiable Credentials
vc = { path = "../vc" }

# External dependencies (explicit versions for Android cross-compilation compatibility)
tokio = { version = "1.42", features = ["full"] }
once_cell = "1.19"
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = { workspace = true }
tracing = "0.1"
url = "2.5"
multibase = "0.9"
sicpa_didcomm = { package = "didcomm", git = "https://github.com/Ajna-inc/didcomm-rust", branch = "main", features = ["uniffi"] }
bs58 = "0.5"
# Uses the workspace pin (default-features = false, sqlite baseline) so the
# agent doesn't force askar's full default backends. Postgres arrives via the
# `postgres` feature (→ storage/postgres) for server builds only.
aries-askar = { workspace = true }
reqwest = "0.12"  # For HTTP client in async message sending
hex = "0.4"  # For hex encoding/decoding blockchain data
blake3 = "1"  # For ACK signing hash in atomic eCash transfers

# Cryptography for X25519 key derivation
sha2 = "0.10"  # For SHA-512 hashing in Ed25519 to X25519 conversion
curve25519-dalek = "4.1"  # For Ed25519 to X25519 conversion
ed25519-dalek = { version = "2.1", features = ["rand_core"] }  # For Ed25519 signing keys
base64 = "0.21"  # For base64url encoding in JWK format

# OID4VP dependencies
serde_urlencoded = "0.7"  # URL-encoded form data
urlencoding = "2.1"  # URL encoding/decoding

# Peer discovery (optional - native only, not WASM compatible)
mdns-sd = { version = "0.10", optional = true }  # mDNS local network discovery (full featured)
btleplug = { version = "0.11", optional = true }  # BLE discovery for mobile/proximity

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }
rstest = "0.23"
hex = "0.4"
rand = "0.8"
mimalloc = "0.1"
# Examples emit `tracing::info!` etc; pull in a subscriber so they surface.
tracing-subscriber = { workspace = true }

# Dependencies for HTTP server example
[dependencies.axum]
version = "0.7"
optional = true
features = ["http1", "http2", "tokio"]

[dependencies.tower]
version = "0.5"
optional = true

[dependencies.tower-http]
version = "0.6"
optional = true
features = ["cors"]

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.futures-util]
version = "0.3"

[features]
default = []
http-server = ["axum", "tower", "tower-http", "async-stream"]
# Askar Postgres backend (server-side). Off by default so mobile/FFI links
# only SQLite; servers (mediator_server) turn it on.
postgres = ["storage/postgres"]
# AnonCreds - enables AnonCreds credential issuance, holder, and verification
anoncreds = ["anoncreds_core", "protocol_credentials", "protocol_proofs", "vc/anoncreds"]
# Kanon Postgres storage/wallet backend (matches the ACA-Py kanon_storage schema),
# selectable via the `Backends` factory / `STORE=kanon`.
kanon-storage = ["storage/kanon"]
# Kanon on-chain AnonCreds registry (VDR) — selectable via `LEDGER=kanon`.
# Both agents resolve schemas/cred-defs from the shared Besu chain.
kanon-registry = ["dep:registry_kanon", "anoncreds"]
# Discovery feature - enables mDNS and BLE peer discovery (native only, not WASM compatible)
discovery = ["mdns-sd", "btleplug"]

[[example]]
name = "http_server"
path = "examples/http_server/main.rs"
required-features = ["http-server"]

[lints]
workspace = true
