name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Cargo workspace lives in ./src
defaults:
  run:
    working-directory: src

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-test:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Lint (cargo clippy, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  perf-smoke:
    name: perf harness smoke (capture → replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Build the agent server + the idiom-perf tool
        run: |
          cargo build --release -p idiom-perf
          cargo build --release -p agent --example http_server --features http-server

      # Self-contained: idiom is the issuer, idiom-perf is the holder. No
      # external services — proves the capture → replay harness works end to end.
      - name: Smoke — OID4VCI capture → replay against a live idiom agent
        run: |
          AGENT_PORT=3060 AGENT_ENDPOINT=http://localhost:3060 STORE=memory RUST_LOG=error \
            ./target/release/examples/http_server &
          for i in $(seq 1 60); do curl -sf http://localhost:3060/health >/dev/null && break; sleep 1; done
          TARGET=idiom ISSUER=http://localhost:3060 N=300 CORPUS=/tmp/smoke.ndjson \
            ./target/release/idiom-perf capture
          OUT=$(CORPUS=/tmp/smoke.ndjson LEVELS=32 SLICE=250 ./target/release/idiom-perf replay)
          echo "$OUT"
          echo "$OUT" | grep -q "ok=250/250" || { echo "perf smoke FAILED (not all credentials issued)"; exit 1; }

  security-audit:
    name: security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # Fast prebuilt binary rather than compiling cargo-audit from source.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Runs in ./src (workflow default), so it reads src/Cargo.lock and the
      # src/.cargo/audit.toml ignore list. Fails on vulnerabilities; the
      # unmaintained-crate advisories are warnings and do not fail the build.
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit
