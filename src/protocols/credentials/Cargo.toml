[package]
name = "protocol_credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# AnonCreds is optional: the base protocol (W3C ld_vc / jwt_vc / sd-jwt)
# builds without the CL-signature stack. Gated behind the `anoncreds` feature.
anoncreds_core = { path = "../../credentials/anoncreds_core", optional = true }
# W3C / JWT-VC / SD-JWT credential format services (sign + verify). The DIDComm
# issue-credential protocol delegates attachment signing/verification to these.
vc = { path = "../../vc", default-features = false }
agent_core = { path = "../../core/agent_core" }
agent_events = { path = "../../core/agent_events", optional = true }
didcomm = { path = "../../didcomm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
thiserror = "2.0"
async-trait = "0.1"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# Tokio with full features for native, minimal for WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.42", default-features = false, features = ["sync"] }

[features]
default = ["events", "native"]
events = ["agent_events"]
native = ["didcomm/native", "didcomm/v1-compat"]
wasm = ["didcomm/wasm"]
# AnonCreds credential format (CL signatures). Off by default so the crate
# builds for light / mobile targets that only need W3C / JWT / SD-JWT.
anoncreds = ["dep:anoncreds_core", "vc/anoncreds"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
