[package]
name = "protocol_connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent_core = { path = "../../core/agent_core" }
agent_events = { path = "../../core/agent_events", optional = true }
did = { path = "../../did" }
didcomm = { path = "../../didcomm" }
protocol_oob = { path = "../oob" }

async-trait = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
curve25519-dalek = "4.1"
multibase = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
# did-peer is native-only (pulls in affinidi deps with tokio net)
did-peer = { version = "0.7", optional = true }

# Tokio with full features for native, minimal for WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.42", default-features = false, features = ["sync"] }

[features]
default = ["events", "native"]
events = ["agent_events"]
native = ["didcomm/native", "didcomm/v1-compat", "dep:did-peer"]
wasm = ["didcomm/wasm"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
