[package]
name = "agent_module"
version = "0.1.0"
edition = "2021"
description = "Pluggable agent module contract: AgentModule trait + ModuleContext. Lets consumers compose an agent from independently-defined modules instead of the agent hardcoding them."

[dependencies]
agent_core = { path = "../core/agent_core" }
agent_di = { path = "../core/agent_di" }
agent_events = { path = "../core/agent_events" }
didcomm = { path = "../didcomm" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }


# Tokio: the workspace's full runtime on native targets; on wasm32 only what
# compiles there ("sync") — `full` pulls `net`/mio, which does not.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.42", default-features = false, features = ["sync"] }

[lints]
workspace = true
