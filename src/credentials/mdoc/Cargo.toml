[package]
name = "mdoc"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CBOR - using ciborium (newer, better maintained than serde_cbor)
ciborium = "0.2"
ciborium-io = "0.2"

# COSE - CBOR Object Signing and Encryption
coset = "0.3"

# Cryptography
sha2 = "0.10"
rand = "0.8"
hkdf = "0.12"  # For key derivation (Mac0 device auth)
hmac = "0.12"  # For HMAC-based MACs

# X.509 certificate handling
x509-cert = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Utilities
hex = "0.4"
base64 = "0.21"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
