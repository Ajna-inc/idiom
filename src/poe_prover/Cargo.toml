[package]
name = "poe-prover"
version = "0.1.0"
edition = "2021"

# Lean, cross-platform halo2 prover for PoE liveness. Deps are crates.io-only
# (proven to cross-compile to iOS + Android). No ezkl, no external git.
[dependencies]
halo2_proofs = "0.3"
halo2_gadgets = "0.5"
ff = "0.13"
rand = "0.8"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
