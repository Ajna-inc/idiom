[package]
name = "idiom-perf"
version.workspace = true
edition.workspace = true

# Unified performance/load harness for the whole system: DIDComm message
# replay, OID4VCI credential issuance, and AnonCreds issuance — one binary,
# capture → replay against a running agent (see interop-tests/perf).
[[bin]]
name = "idiom-perf"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
